<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hybrid Max-Flow WDN Simulator (Animated)</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
<style>
body{font-family:'Inter',sans-serif;background-color:#f7fafc;}
#network{
  width:100%;height:500px;
  border:2px solid #e2e8f0;border-radius:0.5rem;
  background:#ffffff;
  box-shadow:0 4px 6px -1px rgba(0,0,0,0.1),0 2px 4px -1px rgba(0,0,0,0.06);
}
.flowEdge{
  stroke-dasharray:8;
  animation:flow 1.2s linear infinite;
}
@keyframes flow{
  from{stroke-dashoffset:0;}
  to{stroke-dashoffset:16;}
}
</style>
</head>
<body class="p-4 sm:p-8">
<div class="max-w-4xl mx-auto bg-white rounded-xl shadow-2xl p-6 md:p-10">
  <h1 class="text-3xl font-bold text-gray-800 mb-2">Max-Flow WDN Pathfinder (Animated)</h1>
  <p class="text-sm text-gray-500 mb-6">Simulate dynamic water rerouting using Maximum Flow and Priority Scaling — with live flow animation.</p>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6 p-4 bg-blue-50 rounded-lg border border-blue-200">
    <div>
      <label for="startNode" class="block text-sm font-medium text-gray-700">Source Node (S):</label>
      <select id="startNode" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-blue-500 focus:border-blue-500"></select>
    </div>
    <div>
      <label for="endNode" class="block text-sm font-medium text-gray-700">Destination Node (D):</label>
      <select id="endNode" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-blue-500 focus:border-blue-500"></select>
    </div>
    <div>
      <label for="priorityFactor" class="block text-sm font-medium text-gray-700">Priority Factor (1.0 = None):</label>
      <input type="number" id="priorityFactor" value="1.5" min="1.0" step="0.1" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-blue-500 focus:border-blue-500">
      <p class="text-xs text-gray-500 mt-1">Simulates Capacity Scaling (e.g., Hospital = 1.5)</p>
    </div>
  </div>

  <button onclick="calculateFlow()" class="w-full py-2 px-4 rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition duration-150 ease-in-out">
    Calculate Optimal Flow & Animate
  </button>

  <div id="network" class="mt-6"></div>

  <div id="output" class="mt-6 p-4 bg-gray-50 rounded-lg border border-gray-200">
    <h3 class="text-xl font-semibold text-gray-800 mb-2">Results:</h3>
    <p id="maxFlowResult" class="text-lg font-bold text-green-700">Max Flow: --</p>
    <p id="pathResult" class="mt-2 text-sm text-gray-600">Optimal Path: --</p>
    <p id="distanceResult" class="mt-2 text-sm text-gray-600">Path Distance/Cost: --</p>
    <p id="priorityEffect" class="mt-2 text-sm text-gray-600">Priority Effect: --</p>
  </div>
</div>

<script>
let network=null,nodes=new vis.DataSet(),edges=new vis.DataSet(),G_nx=new Map(),flowAnimation=null;

function createInitialGraph(){
  nodes.clear();edges.clear();G_nx.clear();
  const source='S',critical='HOSPITAL',res='RESIDENTIAL';
  const nodeData=[
    {id:source,label:source,group:'source',x:-300,y:0},
    {id:critical,label:critical,group:'critical',x:300,y:-100},
    {id:res,label:res,group:'residential',x:300,y:100}
  ];
  for(let i=1;i<=10;i++){
    nodeData.push({id:`J${i}`,label:`J${i}`,group:'junction',x:-200+(i*40)%400,y:-150+i*30});
  }
  nodes.add(nodeData);
  function addEdge(f,t,c,d){
    edges.add({id:`${f}-${t}`,from:f,to:t,label:`${c}/${d}`,arrows:'to',capacity:c,distance:d});
    if(!G_nx.has(f))G_nx.set(f,[]);
    G_nx.get(f).push({to:t,capacity:c,distance:d,originalCapacity:c});
  }
  const bc=50,bd=10;
  addEdge(source,'J1',bc*3,bd*2);
  addEdge(source,'J2',bc*2,bd*1.5);
  addEdge('J1','J3',bc,bd);addEdge('J2','J4',bc,bd);
  addEdge('J3','J5',bc,bd);addEdge('J4','J6',bc,bd);
  addEdge('J5','J7',bc,bd);addEdge('J6','J8',bc,bd);
  addEdge('J1','J6',bc*1.5,bd*1.2);
  addEdge('J7',critical,bc*2,bd*0.5);addEdge('J8',critical,bc,bd*0.8);
  addEdge('J7',res,bc,bd);addEdge('J9',res,bc*1.5,bd*0.7);addEdge('J10',res,bc,bd);
  addEdge('J5','J9',bc,bd*2);addEdge('J6','J10',bc,bd*1.8);addEdge('J4','J9',bc/2,bd*3);
  populateDropdowns(source,critical,res);initNetwork();
}

function initNetwork(){
  const data={nodes:nodes,edges:edges};
  const opts={
    nodes:{shape:'dot',size:16,font:{size:12},borderWidth:2,
      color:{background:'#f5f5f5',border:'#4a90e2',highlight:'#3498db'}},
    edges:{width:2,shadow:true,smooth:{type:'dynamic'}},
    groups:{
      source:{color:{background:'#27ae60',border:'#1e8449'},size:25,shape:'star'},
      critical:{color:{background:'#e74c3c',border:'#c0392b'},size:20,shape:'square'},
      residential:{color:{background:'#f39c12',border:'#d35400'},size:18,shape:'dot'},
      junction:{color:{background:'#ecf0f1',border:'#bdc3c7'}}
    },
    physics:{enabled:true,solver:'barnesHut'}
  };
  network=new vis.Network(document.getElementById('network'),data,opts);
}

function populateDropdowns(s,c,r){
  const st=document.getElementById('startNode'),en=document.getElementById('endNode');
  const ids=nodes.getIds().filter(i=>i!=='S');
  st.innerHTML=`<option value="${s}">${s}</option>`;
  en.innerHTML=`<option value="${c}" selected>${c} (Critical)</option><option value="${r}">${r} (Residential)</option>`;
  ids.filter(i=>![s,c,r].includes(i)).forEach(i=>en.innerHTML+=`<option value="${i}">${i}</option>`);
}

function findAugPath(g,s,e,resid){
  const q=[{node:s,path:[],flow:Infinity,d:0}],v=new Set([s]);
  while(q.length){
    const {node,path,flow,d}=q.shift();
    if(node===e)return{path,flow,d};
    for(const ed of g.get(node)||[]){
      const to=ed.to,res=resid.get(`${node}-${to}`)||ed.capacity;
      if(!v.has(to)&&res>0){
        v.add(to);
        q.push({node:to,path:[...path,{from:node,to,flow:Math.min(flow,res),distance:ed.distance}],flow:Math.min(flow,res),d:d+ed.distance});
      }
    }
  }return null;
}

function maxFlow(g,s,e){
  let tot=0,resid=new Map();
  g.forEach((edges,f)=>edges.forEach(ed=>resid.set(`${f}-${ed.to}`,ed.capacity)));
  while(true){
    const p=findAugPath(g,s,e,resid);
    if(!p)break;
    tot+=p.flow;
    p.path.forEach(seg=>{
      const f=`${seg.from}-${seg.to}`,r=`${seg.to}-${seg.from}`;
      resid.set(f,(resid.get(f)||0)-p.flow);
      resid.set(r,(resid.get(r)||0)+p.flow);
    });
    return{totalFlow:tot,path:p.path,totalDistance:p.d};
  }
  return{totalFlow:tot,path:[],totalDistance:0};
}

function calculateFlow(){
  const s=document.getElementById('startNode').value;
  const e=document.getElementById('endNode').value;
  let pF=parseFloat(document.getElementById('priorityFactor').value)||1.0;
  if(pF<1)pF=1;
  const Gm=new Map();
  G_nx.forEach((edges,f)=>{
    const nE=[];edges.forEach(ed=>{
      let c=ed.originalCapacity,d=ed.distance;
      if(ed.to===e&&e==='HOSPITAL'){c*=pF;d/=pF;}
      nE.push({to:ed.to,capacity:c,distance:d,originalCapacity:ed.originalCapacity});
    });
    Gm.set(f,nE);
  });
  const res=maxFlow(Gm,s,e);
  edges.update(edges.map(x=>({id:x.id,color:{color:'#cbd5e1'},width:2})));
  if(res.path.length){
    animateFlow(res.path);
  }
  document.getElementById('maxFlowResult').textContent=`Max Flow: ${res.totalFlow.toFixed(2)} m³/hr`;
  document.getElementById('pathResult').textContent=`Optimal Path: ${res.path.map(p=>p.from).join(' -> ')} -> ${e}`;
  document.getElementById('distanceResult').textContent=`Path Distance: ${res.totalDistance.toFixed(2)} km`;
  document.getElementById('priorityEffect').textContent=(pF>1)?`Critical link boosted ${pF}× for ${e}`:`Standard max-flow (1.0)`;
}

function animateFlow(path){
  if(flowAnimation)clearInterval(flowAnimation);
  let step=0;
  flowAnimation=setInterval(()=>{
    step=(step+1)%10;
    const edgeUpdates=path.map(seg=>{
      const col=`hsl(${210+(step*5)},70%,50%)`;
      return{id:`${seg.from}-${seg.to}`,color:{color:col},width:4};
    });
    edges.update(edgeUpdates);
  },120);
}
window.onload=createInitialGraph;
</script>
</body>
</html>
